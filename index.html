<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>D'Limp Produtos de Limpeza</title>
    <meta name="description" content="Catálogo de produtos de limpeza residencial, industrial, automotiva e utilidades da D'Limp.">
    <meta name="theme-color" content="#0877e8">
    <meta property="og:title" content="D'Limp Produtos de Limpeza">
    <meta property="og:description" content="Confira nosso catálogo de produtos de limpeza residencial, industrial, automotiva e utilidades.">
    <meta property="og:image" content="https://dlimp.netlify.app/img/logo.png">
    <meta property="og:url" content="https://dlimp.netlify.app">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <img src="img/logo.png" alt="D'Limp Produtos de Limpeza" class="store-logo">
        <div class="area-busca">
            <span class="icone-busca" aria-hidden="true"></span>
            <input type="search" id="busca" placeholder="Buscar produto..." aria-label="Buscar produto" autocomplete="off">
            <button type="button" id="limparBusca" class="btn-limpar-busca" aria-label="Limpar busca" hidden>✕</button>
        </div>
    </header>

    <nav class="abas-categorias" id="menuCategorias" aria-label="Categorias de produtos">
        <button type="button" class="btn-cat ativo" data-filtro="todos" aria-pressed="true">Todos</button>
        <button type="button" class="btn-cat" data-filtro="favoritos" aria-pressed="false">❤️ Favoritos</button>
        <button type="button" class="btn-cat" data-filtro="promocoes" aria-pressed="false">🔥 Promoções</button>
        <button type="button" class="btn-cat" data-filtro="novos" aria-pressed="false">✨ Novos</button>
        <button type="button" class="btn-cat" data-filtro="residencial" aria-pressed="false">🏠 Residencial</button>
        <button type="button" class="btn-cat" data-filtro="industrial" aria-pressed="false">🏭 Industrial</button>
        <button type="button" class="btn-cat" data-filtro="automotivo" aria-pressed="false">🚗 Automotivo</button>
        <button type="button" class="btn-cat" data-filtro="utilitarios" aria-pressed="false">🧹 Utilitários</button>
    </nav>

    <section class="resumo-lista" aria-live="polite">
        <span id="contadorResultados">0 produtos</span>
    </section>

    <main id="produtos" class="container-produtos" aria-live="polite"></main>

    <div id="modalCarrinho" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tituloCarrinho">
        <div class="modal-content">
            <section id="telaCarrinho">
                <div class="modal-topo">
                    <h2 id="tituloCarrinho">Seu Pedido</h2>
                    <button type="button" id="fecharCarrinho" class="btn-fechar" aria-label="Fechar carrinho">✕</button>
                </div>

                <div id="itensCarrinho" class="lista-itens-carrinho"></div>

                <div class="rodape-carrinho">
                    <h3 id="totalCarrinho">Total: R$ 0,00</h3>
                    <div id="avisoPedidoMinimo" style="display: none;">Pedido mínimo de R$ 50,00 para entrega.</div>
                    <button type="button" id="btnCheckout" class="btn-enviar">Confirmar e informar endereço</button>
                    <button type="button" id="btnLimparCarrinho" class="btn-limpar-tudo">🗑️ Limpar carrinho</button>
                </div>
            </section>

            <section id="telaCheckout" style="display: none;">
                <div class="modal-topo">
                    <h2>Dados de Entrega</h2>
                    <button type="button" class="btn-fechar" data-fechar-modal aria-label="Fechar carrinho">✕</button>
                </div>

                <div class="secao-entrega">
                    <label for="entregaNome" class="label-campo">Nome</label>
                    <input type="text" id="entregaNome" class="campo-input" placeholder="Seu nome completo" autocomplete="name">

                    <label for="entregaRua" class="label-campo">Endereço</label>
                    <input type="text" id="entregaRua" class="campo-input" placeholder="Rua, número e complemento" autocomplete="street-address">

                    <label for="entregaCidade" class="label-campo">Cidade e bairro</label>
                    <input type="text" id="entregaCidade" class="campo-input" placeholder="Cidade e bairro" autocomplete="address-level2">

                    <label for="entregaPagamento" class="label-campo">Forma de pagamento</label>
                    <select id="entregaPagamento" class="campo-input">
                        <option value="Pix">📱 Pix</option>
                        <option value="Dinheiro">💵 Dinheiro</option>
                        <option value="Cartão">💳 Cartão</option>
                    </select>
                </div>

                <button type="button" id="btnEnviarPedido" class="btn-enviar">Enviar pedido no WhatsApp</button>
                <button type="button" id="btnVoltarCarrinho" class="btn-voltar">← Voltar ao carrinho</button>
            </section>
        </div>
    </div>

    <div id="barraCarrinho" class="barra-carrinho-fixa">
        <div class="info-barra">
            <strong id="qtdItens">0 itens</strong>
            <span id="valorTotal">R$ 0,00</span>
        </div>
        <button type="button" id="abrirCarrinho" class="btn-ver-carrinho">Ver carrinho</button>
    </div>

    <script src="js/produtos.js"></script>
    <script src="js/carrinho.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
