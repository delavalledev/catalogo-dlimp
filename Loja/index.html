

<!DOCTYPE html>
<html lang="pt-BR">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>D'Limp Produtos de Limpeza</title>

    <!-- Meta Tags para o WhatsApp -->
    <meta property="og:title" content="D'Limp Produtos de Limpeza">
    <meta property="og:description" content="Catálogo completo de produtos de limpeza profissional e residencial.">
    <meta property="og:image" content="https://dlimp.netlify.app/img/logo.png">
    <meta property="og:url" content="https://dlimp.netlify.app">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <img src="img/logo.png" alt="D'Limp Produtos de Limpeza" class="store-logo">
    <input type="text" id="busca" placeholder="Buscar produto...">
</header>

<div class="abas-categorias" id="menuCategorias">
    <button class="btn-cat ativo" onclick="filtrarPorCategoria('todos')">Todos</button>
    <button class="btn-cat" onclick="filtrarPorCategoria('residencial')">🏠 Residencial</button>
    <button class="btn-cat" onclick="filtrarPorCategoria('industrial')">🏭 Industrial</button>
    <button class="btn-cat" onclick="filtrarPorCategoria('automotivo')">🚗 Automotivo</button>
    <button class="btn-cat" onclick="filtrarPorCategoria('utilitarios')">🧹 Utilitários</button>
</div>

<main id="produtos" class="container-produtos"></main>

<div id="modalCarrinho" class="modal hidden">
    <div class="modal-content">
        
        <div id="telaCarrinho">
            <div class="modal-topo">
                <h2>Seu Pedido</h2>
                <button onclick="document.getElementById('modalCarrinho').classList.add('hidden')" class="btn-fechar">✖</button>
            </div>
            
            <div style="display: flex; justify-content: center; margin-bottom: 15px;">
                <button id="btnLimparCarrinho" class="btn-limpar-tudo" onclick="limparTodoOCarrinho()">🗑️ Limpar Carrinho</button>
            </div>
            
            <div id="itensCarrinho" class="lista-itens-carrinho"></div>
            
            <div class="rodape-carrinho">
                <h3 id="totalCarrinho">Total: R$ 0,00</h3>
                <div id="avisoPedidoMinimo">⚠️ Pedido mínimo de R$ 50,00 para entrega.</div>
                <button id="btnProximoPasso" class="btn-enviar" onclick="abrirCheckout()">Confirmar e Informar Endereço</button>
            </div>
        </div>

        <div id="telaCheckout" style="display: none;">
            <div class="modal-topo">
                <h2>Dados de Entrega</h2>
                <button onclick="document.getElementById('modalCarrinho').classList.add('hidden')" class="btn-fechar">✖</button>
            </div>
            
            <div class="secao-entrega">
                <input type="text" id="entregaNome" class="campo-input" placeholder="Nome Completo">
                <input type="text" id="entregaRua" class="campo-input" placeholder="Rua e Número">
                <input type="text" id="entregaCidade" class="campo-input" placeholder="Cidade / Bairro">
                <select id="entregaPagamento" class="campo-input">
                    <option value="Pix">📱 Pix</option>
                    <option value="Dinheiro">💵 Dinheiro</option>
                    <option value="Cartão">💳 Cartão</option>
                </select>
            </div>

            <button id="btnEnviarPedido" class="btn-enviar" onclick="finalizarPedido()">Enviar Pedido no WhatsApp</button>
            <button class="btn-voltar" onclick="voltarParaCarrinho()">⬅ Voltar ao Carrinho</button>
        </div>
    </div>
</div>

<div id="barraCarrinho" class="barra-carrinho-fixa">
    <div class="info-barra">
        <strong id="qtdItens">0 itens</strong>
        <span id="valorTotal">R$ 0,00</span>
    </div>
    <button id="abrirCarrinho" class="btn-ver-carrinho" onclick="document.getElementById('modalCarrinho').classList.remove('hidden')">Ver Carrinho</button>
</div>

<script src="js/produtos.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/app.js"></script>
</body>
</html>
